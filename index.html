<body class="bg-rose-50 font-poppins overflow-hidden">
    <div class="flex flex-nowrap justify-center items-center  h-full">
        <div class="w-[12%] bg-white h-screen py-3 sticky top-0 ">
            <aside class="flex flex-wrap gap-4 items-center justify-start sticky top-0 h-fit">
                <div class="flex gap-2 items-center w-[90%] px-3 ">

                </div>
                <a href="#" class=" nav-item active flex items-center gap-3 w-[95%] h-[40px] rounded-lg px-3 text-sm font-medium transition-all hover:bg-red-900 hover:text-white" data-page="inscriptions">

        <div class="flex justify-center  flex-wrap h-screen overflow-y-auto">
            <main class="w-[96%] flex flex-wrap gap-7 ">
                <div class="shadow-sm rounded-lg h-[70px] px-6 py-4 bg-white flex items-center flex items-center justify-between w-[100%] sticky top-0 z-10">
                    
                    <input type="text"
                    id="rechercher"

                    placeholder="🔍 rechercher..">
                    
                      <!-- Notifications + Profil (droite) -->
                    <div class="flex items-center gap-3">

                        <!-- Cloche -->
                        <div class="relative w-9 h-9 flex items-center justify-center rounded-lg bg-gray-50 border border-gray-200 cursor-pointer hover:bg-rose-50"
                            id="btnCloche">
                        <i class="fa-regular fa-bell text-gray-500 text-sm"></i>
                        <span id="badgeNotif"
                            class="absolute -top-1 -right-1 bg-red-600 text-white text-[9px] font-bold rounded-full w-4 h-4 flex items-center justify-center">
                            3
                        </span>
                        </div>

                        <!-- Profil -->
                        <div class="flex items-center gap-2 px-3 py-1 rounded-lg bg-gray-50 border border-gray-200 cursor-pointer hover:bg-rose-50"
                            id="btnProfil">
                        <div class="w-7 h-7 rounded-full bg-red-900 flex items-center justify-center text-white text-[10px] font-bold">AD</div>
                        <div>
                            <div class="text-xs font-semibold text-gray-800">Dr. Admin</div>
                            <div class="text-[10px] text-gray-400">Super admin</div>
                        </div>
                        <i class="fa-solid fa-chevron-down text-gray-400 text-[10px]"></i>
                        </div>

                    </div>


                </div>
                <div class=" flex items-center justify-between w-full h-[50px]  ">
                    <h1 class="text-red-900 font-bold text-2xl">LISTE DES INSCRIPTIONS</h1>
                    <div class="flex gap-6 h-[40px] items-center justify-center">
                    <div class="w-[50%] h-[100%] flex items-center justify-center  gap-3  " >
                        <div class="block text-lg w-20 font-medium mb-1 flex gap-2 items-center justify-center text-red-900"><i class="fa-solid fa-filter"></i>Filtre :</div>
                        <div class="w-[70%] h-[100%]">
                            <select id="filtreFormation"
                            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-800 bg-white h-[100%]">
                            <option value="">-- TOUTES --</option>

                            <option value="devWeb-L1">Développement web - L1</option>
                            <option value="devWeb-L2">Développement web - L2</option>
                            <option value="devWeb-L3">Développement web - L3</option>
                            <option value="GL-L1">Génie logiciel - L1</option>
                            <option value="GL-L2">Génie logiciel - L2</option>
                            <option value="data-L1">Développement data - L1</option>
                            </select>
                        </div>
                    </div>
                        <button class="border border-red-900 font-medium rounded-xl w-[120px] h-[90%] hover:bg-red-900 hover:text-white"
                            id="btnAllArchives">
                            <i class="fa-solid fa-box-archive px-2"></i>
                            Archives
                        </button>
                        <button class="border border-red-900 font-medium rounded-xl w-[120px] h-[90%] bg-red-900 text-white hover:border-red-200 hover:bg-red-100 hover:text-red-900"
                            id="btnAjouter"> 
                            <i class="fa-solid fa-plus text-lg px-1"></i>
                        Ajouter
                        </button>
                        
                    </div>
                </div>
                <div class="bg-white w-[100%] rounded-xl h-screen overflow-y-auto ">
                    <table class="w-full  text-sm">
                        <thead class="font-bold h-[40px] bg-red-900 text-white sticky top-0">
                            <tr>
                                <td class="px-3 py-3 text-left">nom</td>
                                <td class="px-3 py-3 text-left">prenom</td>
                                <td class="px-3 py-3 text-left">Email</td>
                                <td class="px-3 py-3 text-left">Telephone</td>
                                <td class="px-3 py-3 text-left">Formation</td>
                                <td class="px-3 py-3 text-left">Date</td>
                                <td class="px-3 py-3 text-center">Actions</td>
                            </tr>
                        </thead>
                        <tbody class="text-sm" id="listeInscription" >
                            <!-- <tr class="border-b border-gray-100 hover:bg-rose-50 transition-colors' h-[50px] ">
                                <td class="text-lg px-3 py-3 text-left">Diouf</td>
                                <td class="text-lg px-3 py-3 text-left">Aminata</td>

                                <td class="text-sm px-3 py-3 text-left">
                                    <span class="px-4 py-1 rounded-2xl bg-red-100 text-red-800 ">GEL-L1</span>
                                </td>
                                <td class="text-lg px-3 py-3 text-left text-gray-500">20/12/2026</td>
                                <td class="text-center px-3 py-3 ">
                                        <div class="flex gap-2 items-center justify-center ">
                                            <button
                                                id="btnModifier"
                                                class="w-8 h-8 rounded-lg bg-orange-50 border border-orange-300 text-orange-500 hover:bg-orange-500 hover:text-white transition-colors">
                                            ✏️
                                            </button>
                                            <button
                                                id="btnArchiver"
                                                class="w-8 h-8 rounded-lg bg-orange-50 border border-orange-300 text-orange-500 hover:bg-orange-500 hover:text-white transition-colors">
                                            🗃️
                                            </button> 
                                        </div>
                                </td>
                            </tr> -->
       
                        </tbody>
                    </table>
                </div>
            </main>

        </div>
    </div>
<!-- ════════════════════════════════════════════
 TOASTS 
 ════════════════════════════════════════════ -->
<div id="zoneToast" class="fixed bottom-6 right-6 z-[100] flex flex-col gap-3"></div>
<!-- ════════════════════════════════════════════
     MODAL — AJOUTER
════════════════════════════════════════════ -->

        <div id="modalAjouter" class=" hidden border border-black  flex flex-wrap justify-center items-center gap-4 p-2 fixed inset-0 bg-black/40 z-50  ">
            <form 
                id="formAjouter"
                class="bg-white rounded-2xl shadow-xl w-[440px] max-w-[95vw] p-7 flex flex-wrap justify-center items-center gap-3">
            <div  
            class="flex items-center justify-between w-[90%]">
                <h2 class="font-bold text-lg text-red-900">✏️ Ajouter une inscription</h2>
                <button id="fermerAjouter" class="text-gray-400 hover:text-gray-600 text-xl font-bold">✕</button>
            </div>

            <div class="w-[90%]">
                <label class="block text-sm font-medium mb-1 px-2">Nom *</label>
                <span id="nomError"></span>
                <input id="nom" type="text"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-800"
                placeholder="Nom de famille"/>
            </div>
            <div class="w-[90%]">
                <label class="block text-sm font-medium mb-1 px-2">Prenom *</label>
                <span id="prenomError"></span>
                <input id="prenom" type="text"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-800"
                placeholder="prenom de famille"/>
            </div>
            <div class="w-[90%]">
                <label class="block text-sm font-medium mb-1 px-2">Email *</label>
                <span id="emailError"></span>
                <input id="email" type="text"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-800"
                placeholder="mettez votre email"/>
            </div>
            <div class="w-[90%]">
                <label class="block text-sm font-medium mb-1 px-2">Telephone *</label>
                <span id="telephoneError"></span>
                <input id="telephone" type="number"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-800"
                placeholder="mettez votre numéro de telephone"/>
            </div>
            <!-- <div class="w-[90%]">
                <label class="block text-sm font-medium mb-1 px-2">Date *</label>
                <input id="date" type="date"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-800"
                />
            </div> -->
            <div class="w-[90%]">
                <label class="block text-sm font-medium mb-1">Formation *</label>
                <span id="formationError"></span>
                <select id="selectFormation"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-red-800 bg-white">
                <option value="">-- Choisir --</option>

                <option value="devWeb-L1">Développement web - L1</option>
                <option value="devWeb-L2">Développement web - L2</option>
                <option value="devWeb-L3">Développement web - L3</option>
                <option value="GL-L1">Génie logiciel - L1</option>
                <option value="GL-L2">Génie logiciel - L2</option>
                <option value="data-L1">Développement data - L1</option>
                </select>
            </div>
             <div class="w-[90%]">
                <button type="submit"
                    id="btnFormulaireAjout"
                    class="w-full bg-red-800 text-white rounded-lg py-2.5 font-semibold text-sm hover:bg-red-900 transition-colors">
                    Créer l'inscription
                </button>
            </div>
            </form>
        </div>

<!-- ════════════════════════════════════════════
     MODAL — CONFIRMATION
════════════════════════════════════════════ -->
<div id="modalConfirm" class="hidden fixed inset-0 bg-black/40 z-[60] flex items-center justify-center">
  <div class="bg-white rounded-2xl shadow-xl w-[340px] max-w-[95vw] p-8 text-center">

    <p id="confirmTexte" class="text-base font-semibold text-red-800 mb-8 leading-relaxed">
      <!-- texte injecté par JS -->
    </p>

    <div class="flex justify-center gap-6">
      <!-- Oui -->
      <button id="confirmOui"
        class="w-12 h-12 rounded-xl bg-green-50 border-2 border-green-500 text-green-600 text-xl hover:bg-green-500 hover:text-white transition-colors">
        <i class="fa-solid fa-check"></i>
      </button>
      <!-- Non -->
      <button id="confirmNon"
        class="w-12 h-12 rounded-xl bg-red-50 border-2 border-red-400 text-red-500 text-xl hover:bg-red-500 hover:text-white transition-colors">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

  </div>
</div>



<!-- ════════════════════════════════════════════
     DRAWER — ARCHIVES
     Positionné fixed à droite, caché par défaut
════════════════════════════════════════════ -->

<!-- Fond sombre derrière le drawer -->
<div id="drawerFond" class="hidden fixed inset-0 bg-black/40 z-40"></div>

<!-- Le drawer -->
<div id="drawer" class="hidden fixed top-0 right-0 h-full w-[420px] max-w-full bg-white z-50 shadow-2xl flex flex-col">

  <!-- En-tête drawer -->
  <div class="flex items-center justify-between px-6 py-4 border-b bg-rose-50">
    <h2 class="font-bold text-red-900 text-lg">📦 Archives</h2>
    <button id="fermerDrawer" class="text-gray-400 hover:text-gray-600 text-xl font-bold">✕</button>
  </div>

  <!-- Barre d'action (cachée tant que rien n'est coché) -->
  <div id="barreActions" class="hidden items-center justify-between px-6 py-3 bg-red-50 border-b border-red-100">
    <span id="nbSelectionnes" class="text-sm font-medium text-red-800"></span>
    <button id="btnDesarchiver"
      class="bg-red-800 text-white text-sm px-4 py-2 rounded-lg font-semibold hover:bg-red-900 transition-colors">
      🔄 Désarchiver
    </button>
  </div>

  <!-- Liste des archives -->
  <div class="flex-1 overflow-y-auto px-6 py-4" id="listeArchives">
    <!-- items générés par JS -->
  </div>

  <!-- Message vide -->
  <div id="archivesVides" class="hidden text-center py-12 text-gray-400 px-6">
    <p class="text-3xl mb-2">📭</p>
    <p class="text-sm">Aucune archive.</p>
  </div>

</div>



    <script type="module" src="./js/app.js"></script>
</body>
</html>
